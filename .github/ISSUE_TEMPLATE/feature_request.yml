name: Feature request
description: Something Conduit should do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you want to make
      description: The shot or asset you're working on, and what Conduit should do for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another tool, or "I can't".
  - type: textarea
    id: references
    attributes:
      label: References
      description: Photos or screenshots of the real thing help a lot.
